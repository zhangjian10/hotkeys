[workspace]
members = [
    "crates/gamemacro-core",
    "crates/gamemacro-daemon",
    "crates/gamemacro-gui/src-tauri",
]
resolver = "2"

[profile.release]
# Build settings optimized for smallest binary size. Notes:
# - opt-level = "z" minimizes size further than "s".
# - lto = "fat" enables whole-program LTO across crates (better size savings when using multiple crates).
# - debug = 0 removes debug info; if you need backtraces keep minimal debug symbols (e.g. =1).
# - overflow-checks = false removes integer overflow checks in release for size and performance.
# - codegen-units = 1 allows more cross-crate optimization (may slow compile but reduces size).
# - panic = "abort" avoids including unwinding machinery.
# - strip = true will ask cargo to strip the final binary (MSVC toolchains may behave differently).

codegen-units = 1           # reduces binary size by ~2%
debug = "full"              # No one needs an undebuggable release binary
lto = true                  # reduces binary size by ~14%
opt-level = "z"             # reduces binary size by ~25%
panic = "abort"             # reduces binary size by ~50% in combination with -Zbuild-std-features=panic_immediate_abort
split-debuginfo = "packed"  # generates a separate *.dwp/*.dSYM so the binary can get stripped
strip = "symbols"           # See split-debuginfo - allows us to drop the size by ~65%
incremental = true          # Improves re-compile times
