[package]
name = "hotkeys-daemon"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hotkeys-daemon"
path = "src/main.rs"

[dependencies]
hotkeys-core = { path = "../hotkeys-core" }
enigo = { version = "0.6.1", default-features = false }
lazy_static = { version = "1.5.0", default-features = false }
notify = "8.2.0"
rdev = { version = "0.5.2", default-features = false }
winapi = { version = "0.3.9", features = [
    "handleapi",
    "securitybaseapi",
    "processthreadsapi",
    "winnt",
] }

[build-dependencies]
winres = "0.1.12"

[package.metadata.winres]
manifest = "app.manifest"
